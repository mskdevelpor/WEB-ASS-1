 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yarn & Petals | Sign In</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.2/flowbite.min.css"
        rel="stylesheet">
</head>

<body class="bg-[#FFF9F3]">

<!-- NAVBAR -->
<nav class="bg-[#6B2635] text-white">
    <div class="max-w-7xl mx-auto px-6 py-4 flex flex-wrap justify-between">

        <a href="../../index.html" class="text-2xl font-bold">
            🧶 Yarn & Petals
        </a>

        <div class="flex flex-wrap gap-5 mt-3 md:mt-0">
            <a href="../../index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="signup.html">Sign Up</a>
            <a href="signin.html">Sign In</a>
        </div>

    </div>
</nav>

<!-- SIGN IN -->
<section class="max-w-md mx-auto px-6 py-14">

    <!-- COMPONENT 1 -->
    <div class="bg-[#D8C3A5] text-[#6B2635] p-4 rounded-xl text-center mb-6">
        🌷 Welcome back!
    </div>

    <!-- COMPONENT 2 -->
    <div class="bg-white shadow-xl rounded-2xl p-8">

        <h1 class="text-3xl font-bold text-[#6B2635] text-center">
            Sign In
        </h1>

        <p class="text-center text-gray-500 mt-2">
            Continue to Yarn & Petals.
        </p>

        <form class="mt-7">

            <!-- COMPONENT 3 -->
            <label class="font-semibold">
                Email
            </label>

            <input
                type="email"
                required
                class="w-full border border-[#D8C3A5] rounded-lg p-3 mt-2 mb-5"
                placeholder="your@email.com">

            <!-- COMPONENT 4 -->
            <label class="font-semibold">
                Password
            </label>

            <input
                type="password"
                required
                class="w-full border border-[#D8C3A5] rounded-lg p-3 mt-2 mb-5"
                placeholder="Password">

            <!-- COMPONENT 5 -->
            <div class="flex items-center justify-between mb-6">

                <label class="flex items-center gap-2">
                    <input type="checkbox">
                    <span>Remember me</span>
                </label>

                <a href="#" class="text-[#6B2635] font-semibold">
                    Forgot?
                </a>

            </div>

            <button
                type="submit"
                class="w-full bg-[#6B2635] text-white py-3 rounded-full">
                Sign In
            </button>

        </form>

        <p class="text-center mt-6">
            Don't have an account?
            <a href="signup.html"
               class="text-[#6B2635] font-bold">
                Sign up.
            </a>
        </p>

    </div>

    <!-- EXTRA COMPONENT -->
    <div class="bg-[#F3D6D8] text-center p-5 rounded-xl mt-6">
        🧶 Handmade products • Beautiful designs • Made with love
    </div>

</section>

<footer class="bg-[#6B2635] text-white text-center py-6">
    © 2026 Yarn & Petals. All Rights Reserved.
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.2/flowbite.min.js"></script>

</body>
</html>
